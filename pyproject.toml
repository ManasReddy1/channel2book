[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "channel2book"
version = "0.1.0"
description = "Turn a YouTube channel into a beginner-friendly textbook."
readme = "README.md"
license = "MIT"
requires-python = ">=3.9"
authors = [{ name = "Manas Reddy" }]
keywords = ["youtube", "textbook", "llm", "education"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Education",
]
dependencies = [
    "typer>=0.9",
    "rich>=13.0",
    "litellm>=1.0",
    "yt-dlp>=2024.0",
    "youtube-transcript-api>=0.6",
    "pydantic>=2.0",
    "aiosqlite>=0.19",
    "jinja2>=3.1",
    "tomli>=2.0; python_version < '3.11'",
]

[project.optional-dependencies]
whisper = ["faster-whisper>=0.10"]
export = ["mkdocs>=1.5", "mkdocs-material>=9.0"]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
    "pytest-cov>=4.0",
    "ruff>=0.1",
    "mypy>=1.0",
]

[project.scripts]
channel2book = "channel2book.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/channel2book"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py39"
line-length = 100
